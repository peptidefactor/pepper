<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peptides Factory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #0a2540; --accent: #00d4b2; }
        body { font-family: sans-serif; margin: 0; background: #fff; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; border-bottom: 1px solid #eee; }
        .logo { height: 60px; }
        .hero { background: var(--main); color: #white; text-align: center; padding: 60px 20px; color: white; }
        .container { width: 90%; margin: 40px auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { border: 1px solid #eee; border-radius: 8px; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px; }
        .price { color: #666; font-weight: bold; margin: 10px 0; }
        .btn { background: var(--main); color: #white; display: block; padding: 10px; text-decoration: none; border-radius: 4px; color: white; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" class="logo">
    <nav>
        <a href="cart.html" style="text-decoration:none; color:black;"><i class="fas fa-shopping-cart"></i> 购物车</a>
    </nav>
</header>

<div class="hero">
    <h1>专业肽类制造商</h1>
    <p>实验室级纯度 | 厂家直销价格</p>
</div>

<div class="container">
    <h2 style="text-align:center;">特色研究肽</h2>
    <div class="grid" id="product-grid">
        </div>
</div>

<script src="data.js"></script>
<script>
    window.onload = function() {
        const grid = document.getElementById('product-grid');
        
        if (typeof PRODUCTS_DATA === 'undefined') {
            grid.innerHTML = "<p style='color:red;'>错误：无法读取 data.js。请检查文件名是否正确且已上传到 GitHub。</p>";
            return;
        }

        PRODUCTS_DATA.forEach(product => {
            const price = typeof getPriceRange === 'function' ? getPriceRange(product) : "Price on request";
            grid.innerHTML += `
                <div class="card">
                    <img src="${product.image}" onerror="this.src='logo.png'">
                    <h3>${product.name}</h3>
                    <div class="price">${price}</div>
                    <a href="product.html?id=${product.id}" class="btn">Select Options</a>
                </div>
            `;
        });
    };
</script>

</body>
</html>
